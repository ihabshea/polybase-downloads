[package]
name = "atlas-history-checker"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
license = "MIT"
description = "Standalone bounded reference checker for recorded Atlas QA histories"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

